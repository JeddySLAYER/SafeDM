name: CI

on:
  push:
    branches: [main, master, "review/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safedm
          POSTGRES_PASSWORD: safedm
          POSTGRES_DB: safedm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safedm -d safedm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://safedm:safedm@localhost:5432/safedm
      ANALYSIS_DEMO_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync + migrate + test
        env:
          SECRET_KEY: ci-test-secret-key-at-least-16
        run: |
          uv sync --group dev
          uv run alembic upgrade head
          uv run pytest -q

  mobile:
    name: Mobile lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: safedm-mobile/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        # Non-bloquant : ESLint legacy peut échouer sans casser les tests
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test -- --ci --watchAll=false
