name: CI

on:
  push:
    branches: [main, master, "review/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safedm
          POSTGRES_PASSWORD: safedm
          POSTGRES_DB: safedm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safedm -d safedm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://safedm:safedm@localhost:5432/safedm
      ANALYSIS_DEMO_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync + migrate + test
        env:
          SECRET_KEY: ci-test-secret-key-at-least-16
        run: |
          uv sync --group dev
          uv run alembic upgrade head
          uv run pytest -q
      - name: Lint (ruff)
        run: uv run ruff check app ml scripts tests

  mobile:
    name: Mobile lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: safedm-mobile/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci --watchAll=false

  mobile-android:
    name: Mobile Android (compile Kotlin)
    # Un build EAS distant echoue seulement apres ~30 min, et uniquement sur
    # la machine EAS. Ce job rejoue l'etape qui casse le plus souvent
    # (`:app:compileReleaseKotlin`) : visibilite de paquet d'un membre Java
    # (`org.json`), import manquant entre deux fichiers Kotlin natifs, API
    # native depreciee. En cas d'echec, le message est ici, en 5 min.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-mobile
    env:
      # Reproduit le profil EAS "apk" : release sans expo-dev-client, API prod.
      APP_ENV: production
      EAS_BUILD_PROFILE: apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect mobile changes
        id: filter
        # GitHub n'accepte pas de filtre `paths` au niveau du job : on compare
        # donc le diff de l'evenement, et on n'enchaîne les etapes lourdes que
        # si `safedm-mobile/` a bougé.
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BASE="${{ github.event.before }}"
          else
            # Push sur une branche : on compare a la base de fusion, pas au
            # commit precedent, sinon seule la derniereSerie de commits est
            # vue.
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi
          if [[ -z "$BASE" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -q '^safedm-mobile/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement dans safedm-mobile/ : compilation Kotlin ignoree."
          fi
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.changed == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: safedm-mobile/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.filter.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.filter.outputs.changed == 'true'
      - name: Install Android SDK packages
        if: steps.filter.outputs.changed == 'true'
        # Le runner image fournit deja le SDK Android (et ses licences) :
        # on n'installe que ce qui manque (compileSdk 35 + build-tools). Le NDK
        # n'est pas requis, `:app:compileReleaseKotlin` ne compile pas le code
        # natif. On n'utilise pas `android-actions/setup-android` : cette
        # action appelle `sdkmanager tools`, paquet retire des cmdline-tools
        # 16 (runner 2025) et fait echouer le job.
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"
      - name: Install
        if: steps.filter.outputs.changed == 'true'
        # Scripts actives : le patch nitro (postinstall) corrige un appel
        # Kotlin incompatible avec RN 0.76, exactement comme sur EAS.
        run: npm ci
      - name: Prebuild android
        if: steps.filter.outputs.changed == 'true'
        run: npx expo prebuild --platform android --no-install
      - name: Compile Kotlin
        if: steps.filter.outputs.changed == 'true'
        run: |
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew :app:compileReleaseKotlin --console=plain

  dashboard:
    name: Dashboard build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: safedm-dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  extension:
    name: Extension lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-extension/SafeDM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: safedm-extension/SafeDM/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify production bundle
        run: |
          # Le bundle publie ne doit contenir ni code HMR (ws://) ni URL de
          # dev : le manifest ne pointe que sur background/ et content/.
          if grep -rn "ws://\|localhost:8081" build/ ; then
            echo "::error::Code de développement (ws://) présent dans le build de production."
            exit 1
          fi
          for required in manifest.json index.html options.html background/background.js content/content.js; do
            if [ ! -f "build/$required" ]; then
              echo "::error::Fichier manquant dans le bundle : $required"
              exit 1
            fi
          done
          node -e "JSON.parse(require('fs').readFileSync('build/manifest.json','utf8')); console.log('manifest.json valide')"
      - name: Package extension
        run: |
          cd build && zip -r ../safedm-extension-${{ github.sha }}.zip . -x '.*'
      - uses: actions/upload-artifact@v4
        with:
          name: safedm-extension-${{ github.sha }}
          path: safedm-extension/SafeDM/safedm-extension-${{ github.sha }}.zip
          retention-days: 14
