# Deploy safedm-dashboard (React + Vite) → Cloudflare Pages.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token avec la permission "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — ID du compte (dashboard Cloudflare → right sidebar)
#
# Première fois en local (crée le projet Pages) :
#   cd safedm-dashboard
#   VITE_API_BASE_URL=https://safedmnew-back.fastapicloud.dev/api/v1 npm run build
#   npx wrangler pages project create safedm-dashboard
#   npx wrangler pages deploy dist --project-name=safedm-dashboard
#
# Backend : ajouter l'origine Pages (https://safedm-dashboard.pages.dev) à CORS_ORIGINS.
#
# Voir docs/DEPLOY_FASTAPI_CLOUD.md pour les autres variables.

name: Deploy Dashboard (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "safedm-dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: safedm-dashboard/package-lock.json

      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant — crée un token Pages:Edit (Cloudflare → My Profile → API Tokens)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID manquant — visible dans le dashboard Cloudflare (barre latérale droite)."
            missing=1
          fi
          exit $missing

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://safedmnew-back.fastapicloud.dev/api/v1' }}
        run: npm run build

      - name: Smoke test CORS (backend de production)
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://safedmnew-back.fastapicloud.dev/api/v1' }}
        run: |
          # Le dashboard est publie sur une origine Cloudflare Pages : le
          # backend doit l'autoriser explicitement dans CORS_ORIGINS. Sans
          # cela, chaque appel API echoue en CORS depuis le navigateur — un
          # echec invisible en CI qui ne se voit qu'a l'usage.
          ORIGIN="https://safedm-dashboard.pages.dev"
          PREFLIGHT=$(curl -s -D - -o /dev/null -X OPTIONS "${API_BASE_URL}/health" \
            -H "Origin: ${ORIGIN}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization" || true)
          STATUS=$(printf '%s' "${PREFLIGHT}" | head -1 | tr -d '\r')
          ALLOW=$(printf '%s' "${PREFLIGHT}" | grep -i "^access-control-allow-origin:" | tr -d '\r' || true)
          echo "preflight : ${STATUS}"
          echo "allow-origin : ${ALLOW:-<absent>}"
          if [ -z "${ALLOW}" ]; then
            echo "::error::Le backend n'autorise pas l'origine ${ORIGIN}. Ajoute-la a CORS_ORIGINS cote backend (FastAPI Cloud) puis redeploie."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: safedm-dashboard
          command: pages deploy dist --project-name=safedm-dashboard
