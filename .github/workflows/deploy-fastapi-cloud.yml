# Deploy safedm-backend → FastAPI Cloud on push to main (or manual).
#
# Secrets (Settings → Secrets and variables → Actions):
#   FASTAPI_CLOUD_TOKEN   — deploy token (dashboard → Deploy Tokens)
#   FASTAPI_CLOUD_APP_ID  — UUID de l'app (header dashboard)
#   DATABASE_URL          — URL PostgreSQL de production (migrations)
#
# Première fois en local (une seule fois) :
#   cd safedm-backend
#   uv run fastapi login
#   uv run fastapi deploy          # crée l'app + .fastapicloud/
#   # puis créer un deploy token dans le dashboard, ou :
#   uv run fastapi cloud setup-ci --secrets-only
#
# Voir docs/DEPLOY_FASTAPI_CLOUD.md

name: Deploy FastAPI Cloud

# Manuel tant que FASTAPI_CLOUD_* ne sont pas dans les secrets du repo.
# Après setup (docs/DEPLOY_FASTAPI_CLOUD.md), tu peux réactiver le bloc `push:` ci-dessous.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "safedm-backend/**"
  #     - ".github/workflows/deploy-fastapi-cloud.yml"

concurrency:
  group: deploy-fastapi-cloud
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safedm-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          missing=0
          if [ -z "$FASTAPI_CLOUD_TOKEN" ]; then
            echo "::error::Secret FASTAPI_CLOUD_TOKEN manquant — voir docs/DEPLOY_FASTAPI_CLOUD.md"
            missing=1
          fi
          if [ -z "$FASTAPI_CLOUD_APP_ID" ]; then
            echo "::error::Secret FASTAPI_CLOUD_APP_ID manquant — voir docs/DEPLOY_FASTAPI_CLOUD.md"
            missing=1
          fi
          exit $missing

      - name: Resolve DATABASE_URL
        id: db
        uses: ./.github/actions/fastapi-cloud-env
        with:
          app-id: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          name: DATABASE_URL

      - name: Check database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || steps.db.outputs.value }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL introuvable (ni secret GitHub, ni variable lisible sur l'app FastAPI Cloud)."
            echo "::error::Sans elle, les migrations de production ne peuvent pas etre appliquees."
            echo "::error::Copier l'URL Postgres de production (FastAPI Cloud → app → Environment Variables) puis : gh secret set DATABASE_URL"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Python + deps
        run: |
          uv python install 3.12
          uv sync --group dev

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || steps.db.outputs.value }}
          # Alembic ne lit pas Settings : on neutralise la validation du
          # secret JWT, sans rapport avec la migration.
          SECRET_KEY: ci-migration-secret-key-at-least-16
        run: |
          # Le code déployé peut/supprimer des tables : sans cette étape, le
          # schéma de production dérive à chaque déploiement.
          uv run alembic upgrade head
          uv run alembic current

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy --app-id "$FASTAPI_CLOUD_APP_ID"
